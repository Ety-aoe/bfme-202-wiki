name: Fortress data audit

on:
  push:
    branches:
      - fix/fortress-upgrades
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect embedded wiki data
        run: python tools/audit_current_wiki.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: fortress-audit
          path: fortress_audit.json
